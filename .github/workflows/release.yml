name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X ngstone/internal/version.Version=${version} -X ngstone/internal/version.Commit=${commit} -X ngstone/internal/version.Date=${date}"

          mkdir -p dist
          go build -trimpath -ldflags "$ldflags" -o dist/ngstone ./cmd/ngstone
          go build -trimpath -ldflags "$ldflags" -o dist/ngstoned ./cmd/ngstoned

      - name: Package archive
        run: |
          archive="ngstone_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -czf "$archive" -C dist ngstone ngstoned

      - uses: actions/upload-artifact@v4
        with:
          name: ngstone_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ngstone_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          (cd release && sha256sum *.tar.gz > checksums.txt)
          ls -l release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.tar.gz release/checksums.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
